name: ICONIC Production Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: iconic-production-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for production deployment and audit the full public site
        env:
          AUDIT_BASE_URL: https://iconic-website-ten.vercel.app
          AUDIT_WAIT_MS: 90000
          AUDIT_CONCURRENCY: 10
          AUDIT_TIMEOUT_MS: 20000
        run: npm run audit:production
