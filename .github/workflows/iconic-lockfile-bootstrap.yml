name: ICONIC Lockfile Bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/iconic-next-security-floor-2026-09'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate deterministic lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-fund
          node <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages || {};
          const assertVersion = (path, version) => {
            if (packages[path]?.version !== version) {
              throw new Error(`${path} expected ${version}, got ${packages[path]?.version}`);
            }
          };
          assertVersion('node_modules/next', '15.5.24');
          assertVersion('node_modules/react', '19.2.8');
          assertVersion('node_modules/react-dom', '19.2.8');
          assertVersion('node_modules/sharp', '0.35.4');
          assertVersion('node_modules/postcss', '8.5.28');
          NODE

      - name: Commit lockfile if missing or changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json already deterministic; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: lock ICONIC patched dependency graph'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
