name: ICONIC Visual Evidence

on:
  push:
    branches:
      - iconic-asset-governance-20260919
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_ORIGIN: https://iconic-website-git-iconic-asset-gove-20400e-dr-dorseys-projects.vercel.app
      VERCEL_SHARE_TOKEN: j6Yb9tHxE773M3vHbsYfK2mevLW5qY3t
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser QA runtime
        run: |
          npm install -g playwright@1.55.0
          playwright install --with-deps chromium
      - name: Wait for branch preview
        run: sleep 90
      - name: Capture and validate rendered evidence
        env:
          NODE_PATH: /opt/hostedtoolcache/node/20.x/x64/lib/node_modules
        run: |
          export NODE_PATH="$(npm root -g)"
          node scripts/capture-visual-evidence.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iconic-visual-evidence-${{ github.sha }}
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 14
