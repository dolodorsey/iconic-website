name: ICONIC Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enforce patched maintenance-LTS floor
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const p = require('./package.json');
          const fail = (m) => { console.error(m); process.exit(1); };
          if (p.dependencies?.next !== '15.5.24') fail(`next must be exactly 15.5.24; found ${p.dependencies?.next}`);
          if (p.dependencies?.react !== '19.2.8') fail(`react must be exactly 19.2.8; found ${p.dependencies?.react}`);
          if (p.dependencies?.['react-dom'] !== '19.2.8') fail(`react-dom must be exactly 19.2.8; found ${p.dependencies?.['react-dom']}`);
          if (p.dependencies?.sharp !== '0.35.4') fail(`sharp must be exactly 0.35.4; found ${p.dependencies?.sharp}`);
          if (p.overrides?.postcss !== '8.5.28') fail(`postcss override must be exactly 8.5.28; found ${p.overrides?.postcss}`);
          NODE

      - name: Install dependencies
        run: npm install --no-fund

      - name: Upload generated lockfile evidence
        uses: actions/upload-artifact@v4
        with:
          name: iconic-package-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Capture production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit.json
          echo "audit_exit=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Upload production audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: iconic-production-audit
          path: npm-audit.json
          if-no-files-found: error

      - name: Enforce production dependency audit
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit.json','utf8'));
          const v = audit.metadata?.vulnerabilities || {};
          console.log(`production vulnerabilities: critical=${v.critical||0}, high=${v.high||0}, moderate=${v.moderate||0}, low=${v.low||0}`);
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) process.exit(1);
          NODE

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
